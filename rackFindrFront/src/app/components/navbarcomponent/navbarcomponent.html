<nav class="barra navbar">
  <div class="container">

    <a class="marca navbar-brand" routerLink="/">
      <span class="logo">&#123; &#125;</span>
      <span class="nombre">RackFindr</span>
    </a>

    <div class="enlaces">

      <a class="enlace" routerLink="/" routerLinkActive="activo"
         [routerLinkActiveOptions]="{ exact: true }">Inicio</a>

      <a class="enlace" routerLink="/buscar" routerLinkActive="activo">Buscar</a>

      <a class="enlace" routerLink="/instalacion" routerLinkActive="activo">Instalación(npm)</a>

      <span class="enlace apagado">Historial</span>

      @if (authService.haySesion()) {
        <button type="button" class="boton-sesion" (click)="authService.cerrarSesion()">
          Cerrar sesión
        </button>
      } @else {
        <a class="boton-sesion" routerLink="/login">Iniciar sesión</a>
      }
    </div>
  </div>
</nav>
