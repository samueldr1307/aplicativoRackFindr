<section class="login">
  <h1>Crear Cuenta</h1>
  @if (!registrado) {
    <form (ngSubmit)="crearCuenta()" ngNativeValidate>
      <label for="username">Usuario</label>
      <input
        id="username"
        name="username"
        type="text"
        autocomplete="username"
        [(ngModel)]="username"
        required
      />

      <label for=" password">Contraseña</label>

      <input
        id="password"
        name="password "
        type="password"
        autocomplete="new-password"
        [(ngModel)]="password"
        required
      />
      <label for="email">Correo electronico</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="email"
        [(ngModel)]="email"
        required
      />

      <button type="submit" [disabled]="enviando">
        {{ enviando ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>
  }
  <p aria-live="polite">{{mensaje}}</p>
  <a class="enlace-cuenta" routerLink="/login">Volver al inicio de sesión</a>

</section>
